  <!-- Accent status bar + subtitle -->
  <rect x="224" y="126" width="56" height="5" rx="2.5" fill="#6EBEFF" />
  <rect x="288" y="126" width="36" height="5" rx="2.5" fill="#73DEA0" />
  <rect x="332" y="126" width="24" height="5" rx="2.5" fill="#FFB05C" />
  <rect x="364" y="126" width="16" height="5" rx="2.5" fill="#FF7676" />

  <text x="222" y="164"
        font-family="Segoe UI, Inter, sans-serif"
        font-size="21"
        font-weight="500"
        letter-spacing="1.8"
        fill="#BCC2D6">laptop · battery · network · temperature</text>
</svg>
