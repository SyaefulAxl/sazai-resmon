<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 220" width="920" height="220">
  <!-- Horizontal Lockup: Resource Monitoring -->
  <rect x="0" y="0" width="920" height="220" rx="28" ry="28" fill="#181822" />
  <rect x="6" y="6" width="908" height="208" rx="24" ry="24" fill="#202230" stroke="#484E64" stroke-width="2" />

  <!-- Scaled Icon Mark (160x160 at x=30, y=30) -->
